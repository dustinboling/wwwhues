name: SPA snapshot rebuild

# Rebuilds and redeploys the hues.flowers SPA worker every 6 hours so
# prerendered live-data snapshots (season status, sponsor availability)
# can never age past one park day (architecture plan §2.1).
#
# INERT until cutover prep: the job runs only when the repository
# variable SPA_REBUILD_ENABLED is "true" AND the CLOUDFLARE_API_TOKEN
# secret exists. Both are cutover-checklist items; until then this
# workflow is a committed deliverable, not a live deploy path.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    if: vars.SPA_REBUILD_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install the fonts package's Python tooling
        run: |
          if [ -f packages/fonts/scripts/requirements-fonts.txt ]; then
            python3 -m pip install -r packages/fonts/scripts/requirements-fonts.txt
          fi
      - name: Install dependencies (root + packages)
        run: |
          npm ci --no-audit --no-fund
          for p in packages/*/; do
            (cd "$p" && npm ci --no-audit --no-fund)
          done
      - name: Build the SPA
        run: npm run build:app
      - name: Deploy the SPA worker
        run: npx wrangler deploy --config wrangler-spa.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "51080ac04974bef5a30d7ceb5b79e9e2"
